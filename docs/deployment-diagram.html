<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>home-agentic-ai 部署图</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; font: 14px/1.7 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #faf9f7; color: #1a1a1a; max-width: 980px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #666; font-size: 13px; margin: 0 0 32px; }

<body>

<h1>home-agentic-ai 部署图</h1>
<p class="sub">云到云架构：你部署的只有一个进程，其余全是借用</p>

<!-- ═══════════ 图一：全貌 ═══════════ -->
<figure>
<svg viewBox="0 0 940 470" role="img" aria-label="部署全貌：左边家庭内网（音箱、常开设备上的服务进程、网关与设备），右边公网三个云（小米云、LLM API、设备规范库）。服务进程经家庭路由器与三个云通信；音箱与米家设备各自接入小米云。">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 区块底色 -->
  <rect x="16" y="16" width="410" height="438" rx="10" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="32" y="42" font-size="13" font-weight="600" fill="#888">家庭内网</text>
  <rect x="514" y="16" width="410" height="438" rx="10" fill="none" stroke="#bbb" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="530" y="42" font-size="13" font-weight="600" fill="#888">公网（全部第三方，零部署）</text>

  <!-- ── 家：音箱 ── -->
  <rect x="40" y="70" width="170" height="66" rx="6" fill="#2e7d32" fill-opacity="0.14" stroke="#2e7d32" stroke-width="1.4"/>
  <text x="125" y="96" font-size="13" font-weight="600" text-anchor="middle">小爱音箱 Art</text>
  <text x="125" y="114" font-size="10.5" text-anchor="middle" fill="#666">耳朵（ASR）和嘴（TTS）</text>
  <text x="125" y="128" font-size="10" text-anchor="middle" fill="#999">原生固件，未改动</text>

  <!-- ── 家：服务进程（视觉重心） ── -->
  <rect x="40" y="200" width="360" height="170" rx="8" fill="none" stroke="currentColor" stroke-width="2.4"/>
  <text x="220" y="228" font-size="14" font-weight="700" text-anchor="middle">home-agentic-ai（你要部署的全部）</text>
  <text x="220" y="247" font-size="11" text-anchor="middle" fill="#777">常开设备上一个 Node.js 进程 · restart=always</text>
  <rect x="60" y="262" width="150" height="88" rx="5" fill="currentColor" fill-opacity="0.07"/>
  <text x="135" y="284" font-size="12" font-weight="600" text-anchor="middle">接入层</text>
  <text x="135" y="302" font-size="10" text-anchor="middle" fill="#666">轮询 · 云协议 · 串行队列</text>
  <text x="135" y="318" font-size="10" text-anchor="middle" fill="#666">四道安全闸门</text>
  <rect x="230" y="262" width="150" height="88" rx="5" fill="currentColor" fill-opacity="0.07"/>
  <text x="305" y="284" font-size="12" font-weight="600" text-anchor="middle">智能体层</text>
  <text x="305" y="302" font-size="10" text-anchor="middle" fill="#666">触发词 · 工具循环</text>
  <text x="305" y="318" font-size="10" text-anchor="middle" fill="#666">设备快照 · 对话记忆</text>

  <!-- ── 家：网关+设备 ── -->
  <rect x="40" y="396" width="170" height="48" rx="6" fill="#2e7d32" fill-opacity="0.14" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="125" y="416" font-size="12" font-weight="600" text-anchor="middle">小米网关</text>
  <text x="125" y="432" font-size="10" text-anchor="middle" fill="#666">蓝牙 / Zigbee 子设备</text>
  <rect x="230" y="396" width="170" height="48" rx="6" fill="#2e7d32" fill-opacity="0.14" stroke="#2e7d32" stroke-width="1.2"/>
  <text x="315" y="416" font-size="12" font-weight="600" text-anchor="middle">米家设备</text>
  <text x="315" y="432" font-size="10" text-anchor="middle" fill="#666">灯 · 空调 · 插座 …</text>

  <!-- ── 云：小米云 ── -->
  <rect x="540" y="70" width="360" height="130" rx="8" fill="#2e7d32" fill-opacity="0.14" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="720" y="96" font-size="14" font-weight="700" text-anchor="middle">小米云</text>
  <rect x="558" y="110" width="160" height="46" rx="4" fill="none" stroke="#2e7d32" stroke-width="1"/>
  <text x="638" y="128" font-size="11" font-weight="600" text-anchor="middle">对话记录</text>
  <text x="638" y="144" font-size="9.5" text-anchor="middle" fill="#666">说的话 / 小爱的答</text>
  <rect x="730" y="110" width="152" height="46" rx="4" fill="none" stroke="#2e7d32" stroke-width="1"/>
  <text x="806" y="128" font-size="11" font-weight="600" text-anchor="middle">IoT 平台</text>
  <text x="806" y="144" font-size="9.5" text-anchor="middle" fill="#666">设备注册 / 指令下发</text>
  <text x="720" y="182" font-size="10" text-anchor="middle" fill="#777">凭你小米账号的登录态访问（非官方接口）</text>

  <!-- ── 云：LLM ── -->
  <rect x="540" y="240" width="170" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="625" y="266" font-size="13" font-weight="600" text-anchor="middle">你订阅的 LLM</text>
  <text x="625" y="284" font-size="10.5" text-anchor="middle" fill="#666">GLM / DeepSeek / Kimi</text>
  <text x="625" y="298" font-size="10" text-anchor="middle" fill="#999">Function Calling</text>

  <!-- ── 云：spec 库 ── -->
  <rect x="730" y="240" width="170" height="70" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="815" y="266" font-size="13" font-weight="600" text-anchor="middle">miot-spec.org</text>
  <text x="815" y="284" font-size="10.5" text-anchor="middle" fill="#666">设备能力规范库</text>
  <text x="815" y="298" font-size="10" text-anchor="middle" fill="#999">每个型号能做什么</text>

  <!-- ═══ 连线（只有 5 条） ═══ -->

  <!-- 1 服务→对话记录（轮询，红） -->
  <line x1="405" y1="240" x2="552" y2="145" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <!-- 2 服务→IoT 平台（控制） -->
  <line x1="412" y1="280" x2="556" y2="160" stroke="currentColor" stroke-width="2" marker-end="url(#a)"/>
  <!-- 3 服务→LLM -->
  <line x1="405" y1="300" x2="534" y2="290" stroke="currentColor" stroke-width="2" marker-end="url(#a)"/>
  <!-- 4 服务→spec 库 -->
  <line x1="412" y1="325" x2="724" y2="300" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#a)"/>
  <!-- 5 音箱/设备→小米云（绿，左侧上行） -->
  <line x1="205" y1="110" x2="536" y2="120" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="380" y1="400" x2="560" y2="205" stroke="#2e7d32" stroke-width="2" marker-end="url(#ag)"/>
  <!-- 5b 小米云→音箱（TTS 下行） -->
  <line x1="536" y1="148" x2="205" y2="130" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ag)"/>

  <!-- 线标签（放线中点上方，不交叉） -->
  <text x="452" y="172" font-size="11" font-weight="600" fill="#c0392b" text-anchor="middle" transform="rotate(-22 452 172)">读你说的话 · 1s/次</text>
  <text x="466" y="248" font-size="11" font-weight="600" text-anchor="middle" transform="rotate(-10 466 248)">控制指令</text>
  <text x="468" y="284" font-size="11" font-weight="600" text-anchor="middle">意图推理</text>
  <text x="560" y="332" font-size="10.5" fill="#888">能力规范（每型号一次）</text>
  <text x="370" y="98" font-size="11" font-weight="600" fill="#2e7d32" text-anchor="middle">语音上云 / TTS 回来</text>
  <text x="500" y="330" font-size="11" font-weight="600" fill="#2e7d32" text-anchor="middle" transform="rotate(55 500 330)">指令推达设备</text>
</svg>
<figcaption>
左：家庭内网；右：三个云服务（零部署、全是借用）。加粗边框的大方框是<b>你要部署的全部</b>——一个跑在常开设备上的 Node.js 进程。音箱与米家设备各自接入小米云（绿线），服务进程读写小米云、调用你的 LLM（黑线）。<b>注意服务与音箱之间没有线</b>——对话数据绕道小米云中转，这是 1~2 秒延迟的来源，也是免刷机的代价。
</figcaption>
</figure>

<!-- ═══════════ 图二：一次指令的时序 ═══════════ -->
<figure>
<svg viewBox="0 0 940 300" role="img" aria-label="一次语音指令的时序：说话、ASR 上云、服务每秒轮询取回、触发词命中、LLM 推理出工具调用、四道闸门本地校验、指令经小米云下发设备、结果回喂 LLM、TTS 播报。共九步。">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- 九步泳道：每步一卡，横向排开，上排 1-5，下排 6-9 -->
  <g font-size="11">
    <!-- 上排 -->
    <rect x="16"  y="40" width="160" height="72" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.1"/>
    <text x="28" y="62" font-weight="700">1 · 你说</text>
    <text x="28" y="80" fill="#666">"小爱同学，</text>
    <text x="28" y="96" fill="#666">请打开客厅灯"</text>

    <rect x="204" y="40" width="160" height="72" rx="6" fill="#2e7d32" fill-opacity="0.12" stroke="#2e7d32" stroke-width="1.1"/>
    <text x="216" y="62" font-weight="700">2 · 音箱 ASR</text>
    <text x="216" y="80" fill="#666">语音转文本，</text>
    <text x="216" y="96" fill="#666">存进小米云端</text>

    <rect x="392" y="40" width="160" height="72" rx="6" fill="none" stroke="#c0392b" stroke-width="1.4"/>
    <text x="404" y="62" font-weight="700">3 · 轮询取回</text>
    <text x="404" y="80" fill="#666">服务每秒拉一次，</text>
    <text x="404" y="96" fill="#666">"请"字触发命中</text>

    <rect x="580" y="40" width="160" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.1"/>
    <text x="592" y="62" font-weight="700">4 · LLM 推理</text>
    <text x="592" y="80" fill="#666">带着设备清单发问，</text>
    <text x="592" y="96" fill="#666">返回工具调用</text>

    <rect x="768" y="40" width="156" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <text x="780" y="62" font-weight="700">5 · 四道闸门</text>
    <text x="780" y="80" fill="#666">类型白名单/黑名单/</text>
    <text x="780" y="96" fill="#666">危险正则/值校验</text>

    <!-- 下排（从右往左，蛇形） -->
    <rect x="768" y="180" width="156" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.1"/>
    <text x="780" y="202" font-weight="700">6 · 下发小米云</text>
    <text x="780" y="220" fill="#666">prop/set 开关=true</text>
    <text x="780" y="236" fill="#666">灯亮（物理世界）</text>

    <rect x="580" y="180" width="160" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.1"/>
    <text x="592" y="202" font-weight="700">7 · 结果回喂</text>
    <text x="592" y="220" fill="#666">执行成功与否</text>
    <text x="592" y="236" fill="#666">作为工具结果给 LLM</text>

    <rect x="392" y="180" width="160" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.1"/>
    <text x="404" y="202" font-weight="700">8 · 生成回复</text>
    <text x="404" y="220" fill="#666">"客厅灯已打开"</text>
    <text x="404" y="236" fill="#666">（两句话内，口语化）</text>

    <rect x="204" y="180" width="160" height="72" rx="6" fill="#2e7d32" fill-opacity="0.12" stroke="#2e7d32" stroke-width="1.1"/>
    <text x="216" y="202" font-weight="700">9 · TTS 播报</text>
    <text x="216" y="220" fill="#666">小米云合成语音</text>
    <text x="216" y="236" fill="#666">推给音箱说出来</text>

    <!-- 上排箭头 -->
    <line x1="176" y1="76" x2="200" y2="76" stroke="currentColor" stroke-width="1.6" marker-end="url(#a2)"/>
    <line x1="364" y1="76" x2="388" y2="76" stroke="currentColor" stroke-width="1.6" marker-end="url(#a2)"/>
    <line x1="552" y1="76" x2="576" y2="76" stroke="currentColor" stroke-width="1.6" marker-end="url(#a2)"/>
    <line x1="740" y1="76" x2="764" y2="76" stroke="currentColor" stroke-width="1.6" marker-end="url(#a2)"/>
    <!-- 蛇形转折 -->
    <path d="M 846 112 L 846 155 Q 846 172 829 172 L 846 172" fill="none" stroke="currentColor" stroke-width="0"/>
    <line x1="846" y1="112" x2="846" y2="176" stroke="currentColor" stroke-width="1.6" marker-end="url(#a2)"/>
    <!-- 下排箭头（向左） -->
    <line x1="764" y1="216" x2="744" y2="216" stroke="currentColor" stroke-width="1.6" marker-end="url(#a2)"/>
    <line x1="576" y1="216" x2="556" y2="216" stroke="currentColor" stroke-width="1.6" marker-end="url(#a2)"/>
    <line x1="388" y1="216" x2="368" y2="216" stroke="currentColor" stroke-width="1.6" marker-end="url(#a2)"/>

    <!-- 延迟标注 -->
    <text x="470" y="160" font-size="10.5" fill="#999" text-anchor="middle">典型全程：说话结束后 2~4 秒听到回复（轮询 1s + LLM 推理 1~2s + TTS）</text>
  </g>
</svg>
<figcaption>
<b>"请打开客厅灯"的九步回路。</b>第 3 步（红框）是延迟来源；第 5 步（加粗框）是安全闸门——设备清单在进 LLM 前已过黑名单与类型白名单（LLM 根本看不到被拒设备），LLM 的每个控制输出再过危险正则与值校验两道本地闸门：危险操作被直接拒绝并提示走米家 App，参数错误则回喂 LLM 自纠。
</figcaption>
</figure>
